<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congressional Members - YGN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1a1f2e">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/features.js" defer></script>
  <script src="js/enhancements.js" defer></script>
  <script src="js/ux.js" defer></script>  <script src="js/settings.js" defer></script>
</head>
<body data-page="members">
  <header class="site-header">
    <a id="brand-home" class="brand" href="index.html" aria-label="YGN home">
      <span class="brand-name">YGN</span>
      <span class="brand-tagline">Your Government Now</span>
    </a>
    <span id="health-indicator" class="checking">Checking</span>
  </header>

  <nav class="main-nav" aria-label="Site navigation">
    <a data-page="home" href="index.html">Home</a>
    <a data-page="members" href="members.html">Congressional Members</a>
    <a data-page="bills" href="recent-bills.html">Recent Bills</a>
    <a data-page="foreign" href="foreign-affairs.html">Foreign Affairs</a>
    <a data-page="economy" href="economy.html">Economy</a>
  </nav>

  <main id="main-content">
    <section id="section-members" class="active">
      <div class="members-controls">
        <input
          id="members-search"
          type="search"
          placeholder="Search by name, state, party…"
          aria-label="Search members"
        >
        <div class="members-filters">
          <label class="filter-field">
            <span>Party</span>
            <select id="members-party" aria-label="Filter by party">
              <option value="">All parties</option>
              <option value="D">Democratic</option>
              <option value="R">Republican</option>
              <option value="I">Independent</option>
            </select>
          </label>
          <label class="filter-field">
            <span>Chamber</span>
            <select id="members-chamber" aria-label="Filter by chamber">
              <option value="">All chambers</option>
              <option value="house">House</option>
              <option value="senate">Senate</option>
            </select>
          </label>
          <label class="filter-field">
            <span>State</span>
            <select id="members-state" aria-label="Filter by state">
              <option value="">All states</option>
            </select>
          </label>
          <label class="filter-field">
            <span>Sort</span>
            <select id="members-sort" aria-label="Sort members">
              <option value="name">Name (A–Z)</option>
              <option value="ideology">Ideology (L→R)</option>
              <option value="ethics">Funding grade</option>
              <option value="seniority">Seniority (longest first)</option>
            </select>
          </label>
          <button
            id="members-saved-toggle"
            class="members-saved-toggle"
            type="button"
            aria-pressed="false"
            title="Show saved members only"
          >
            <svg class="member-save-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6.75 4.75A1.75 1.75 0 0 1 8.5 3h7a1.75 1.75 0 0 1 1.75 1.75v15.1L12 16.6l-5.25 3.25V4.75Z"></path>
            </svg>
            <span>Saved only</span>
            <span id="members-saved-count" class="members-saved-count" aria-label="0 saved members">0</span>
          </button>
        </div>
        <div id="members-count" class="members-count" aria-live="polite"></div>
      </div>
      <div id="ideology-strip" class="ideology-strip" aria-label="Ideology distribution of the members shown" hidden></div>
      <div id="members-grid" class="members-grid" role="list" aria-label="Congressional members"></div>
    </section>
  </main>

  <div id="popover" class="popover" role="tooltip" aria-live="polite">
    <button id="popover-close" class="popover-close" aria-label="Close popover">x</button>
    <div class="popover-name"></div>
    <div class="popover-summary"></div>
  </div>
</body>
</html>
