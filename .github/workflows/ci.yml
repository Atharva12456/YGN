name: CI

on:
  push:
    # The data workflow pushes an "update ethics grade checkpoint" commit on every
    # sweep. Those touch only generated JSON, so running the full browser suite
    # (which downloads Chrome) on them doubled Actions usage for no signal and
    # helped exhaust the monthly minute allowance. Skip when a push changes
    # nothing but generated data.
    paths-ignore:
      - "docs/data/**"
  pull_request:
    paths-ignore:
      - "docs/data/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # Re-downloaded ~25 wheels on every run before this.
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend test dependencies
        run: npm ci
      # Chrome-for-Testing is ~130 MB and was re-downloaded every run (~15-30s).
      - name: Cache Chrome for Puppeteer
        id: chrome-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chrome for Puppeteer
        if: steps.chrome-cache.outputs.cache-hit != 'true'
        run: npx puppeteer browsers install chrome
      - name: Python unit tests
        run: python -m unittest discover -s tests -q
      - name: Frontend checks
        run: npm test
