name: Generate Static Data

on:
  workflow_dispatch:
    inputs:
      max_members:
        description: "Maximum members to snapshot, or all"
        required: false
        default: "all"
      congress:
        description: "Congress number to snapshot; blank uses current Congress"
        required: false
        default: ""
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: generate-static-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      # Optional: set these repo secrets to let the build snapshot AI bill
      # descriptions/impacts into docs/data/bill-ai.json (served without
      # re-calling the model). If unset, the snapshot step no-ops gracefully.
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      MAX_MEMBERS: ${{ github.event.inputs.max_members || 'all' }}
      YGN_CONGRESS: ${{ github.event.inputs.congress }}
      YGN_WIKI_MAX_ATTEMPTS: "1"
      YGN_WIKI_RETRY_DELAY_SECONDS: "1"
      YGN_WIKI_SEARCH_QUERY_LIMIT: "2"
      YGN_WIKI_SEARCH_RESULT_LIMIT: "3"
      # A standard FEC key permits 1,000 calls/hour. At most 30 members x ~4
      # calls every 10 minutes is <=720 calls/hour. Small batches finish and
      # commit frequently, so one slow lookup cannot strand hours of progress.
      YGN_FEC_SCORE_LIMIT: "30"
      YGN_FEC_DELAY_SECONDS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify backend and frontend syntax
        run: |
          python -m unittest discover -s tests -q
          node --check docs/app.js

      - name: Generate static JSON snapshots
        run: python scripts/generate_static_data.py --max-members "$MAX_MEMBERS" --ethics-only

      - name: Commit ethics checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ethics docs/data/member-scores.json docs/data/manifest.json
          if git diff --cached --quiet; then
            echo "No ethics data changes to commit."
          else
            git commit -m "update ethics grade checkpoint"
            git push
          fi

      - name: Snapshot AI bill descriptions/impacts
        run: python scripts/snapshot_bill_ai.py --limit 40

      - name: Harvest AI bill content from the live site (CI has no AI key)
        # The live app has the AI provider key and generates bill AI on its
        # background-refresh queue; this pulls that content into the committed
        # store so the digest never gets stuck on "queued" placeholders even
        # when the AZURE_OPENAI_* secrets aren't set in this repo. Bills not yet
        # generated are queued by the fetch and picked up on the next run.
        run: python scripts/harvest_bill_ai.py --limit 40 || echo "harvest skipped"

      - name: Build civic data snapshots (laws, hearings, EOs, treaties, votes, weekly brief)
        run: python scripts/build_civic_data.py

      - name: Snapshot AI member overviews (budgeted; no-ops without AI secrets)
        run: python scripts/snapshot_member_ai.py --budget 20

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No static data changes to commit."
          else
            git commit -m "update generated static data"
            git push
          fi
