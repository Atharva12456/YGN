name: Generate Static Data

on:
  workflow_dispatch:
    inputs:
      max_members:
        description: "Maximum members to snapshot, or all"
        required: false
        default: "all"
      congress:
        description: "Congress number to snapshot; blank uses current Congress"
        required: false
        default: ""
      ethics_only:
        description: "Only run the fast ethics sweep (skip dossiers/bills/civic)"
        type: boolean
        default: false
  schedule:
    # Hourly (offset off :00 so it isn't stuck behind GitHub's top-of-hour
    # scheduling backlog): a fast, bounded ethics checkpoint. At 40 members per
    # run this refreshes every current member's grade within ~14h — inside the
    # 19h target even if a few scheduled runs are delayed or dropped.
    - cron: "17 * * * *"
    # Once daily: a full refresh so member dossiers, the recent-bills digest,
    # and the national-debt metric don't go stale under the ethics-only sweep.
    - cron: "47 3 * * *"

permissions:
  contents: write

concurrency:
  group: generate-static-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      # Optional: set these repo secrets to let the build snapshot AI bill
      # descriptions/impacts into docs/data/bill-ai.json (served without
      # re-calling the model). If unset, the snapshot step no-ops gracefully.
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      MAX_MEMBERS: ${{ github.event.inputs.max_members || 'all' }}
      YGN_CONGRESS: ${{ github.event.inputs.congress }}
      YGN_WIKI_MAX_ATTEMPTS: "1"
      YGN_WIKI_RETRY_DELAY_SECONDS: "1"
      YGN_WIKI_SEARCH_QUERY_LIMIT: "2"
      YGN_WIKI_SEARCH_RESULT_LIMIT: "3"
      # 50 members x ~5 calls per hourly run is <=250 FEC calls/hour, well under a
      # standard 1,000/hour key. ceil(537 / 50) = 11 runs, so the sweep cursor
      # covers the whole roster in ~11 hours -- margin to spare under the 19h goal
      # even if GitHub delays or drops a few scheduled runs. Progress commits every
      # run, so one slow lookup can't strand more than a single batch.
      YGN_FEC_SCORE_LIMIT: "50"
      YGN_FEC_DELAY_SECONDS: "0"
      # Sequential (1): the FEC backend throttles concurrent bursts even under the
      # hourly budget, and parallel workers were silently dropping most of each
      # batch to N/A. 50 members sequentially is still ~2 min/run. Raise only if a
      # run's logs show ample X-RateLimit-Remaining.
      YGN_FEC_WORKERS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide run mode
        id: mode
        # The hourly cron is the fast ethics-only checkpoint. The daily cron and
        # manual dispatch do a full refresh, unless ethics_only is requested.
        run: |
          if [ "${{ github.event.schedule }}" = "17 * * * *" ] || [ "${{ github.event.inputs.ethics_only }}" = "true" ]; then
            echo "ethics_only=true" >> "$GITHUB_OUTPUT"
            echo "Run mode: ethics-only checkpoint sweep."
          else
            echo "ethics_only=false" >> "$GITHUB_OUTPUT"
            echo "Run mode: full data refresh."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify backend and frontend syntax
        run: |
          python -m unittest discover -s tests -q
          node --check docs/app.js

      - name: Generate static JSON snapshots (ethics-only)
        if: steps.mode.outputs.ethics_only == 'true'
        run: python scripts/generate_static_data.py --max-members "$MAX_MEMBERS" --ethics-only

      - name: Generate static JSON snapshots (full)
        if: steps.mode.outputs.ethics_only == 'false'
        run: python scripts/generate_static_data.py --max-members "$MAX_MEMBERS"

      - name: Commit ethics checkpoint
        # Commit the ethics progress before the heavier steps so a later failure
        # never strands a run's FEC work. Push with a rebase-retry because main
        # moves under us (other data commits, deploys) — a plain push would
        # regularly fail non-fast-forward.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ethics docs/data/member-scores.json docs/data/manifest.json
          if git diff --cached --quiet; then
            echo "No ethics data changes to commit."
            exit 0
          fi
          git commit -m "update ethics grade checkpoint"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt/3); rebasing on origin/$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME" || git rebase --abort || true
            sleep 3
          done
          echo "::error::Could not push ethics checkpoint after 3 attempts"
          exit 1

      - name: Snapshot AI bill descriptions/impacts
        if: steps.mode.outputs.ethics_only == 'false'
        run: python scripts/snapshot_bill_ai.py --limit 40

      - name: Harvest AI bill content from the live site (CI has no AI key)
        if: steps.mode.outputs.ethics_only == 'false'
        # The live app has the AI provider key and generates bill AI on its
        # background-refresh queue; this pulls that content into the committed
        # store so the digest never gets stuck on "queued" placeholders even
        # when the AZURE_OPENAI_* secrets aren't set in this repo. Bills not yet
        # generated are queued by the fetch and picked up on the next run.
        run: python scripts/harvest_bill_ai.py --limit 40 || echo "harvest skipped"

      - name: Build civic data snapshots (laws, hearings, EOs, treaties, votes, weekly brief)
        if: steps.mode.outputs.ethics_only == 'false'
        run: python scripts/build_civic_data.py

      - name: Snapshot AI member overviews (budgeted; no-ops without AI secrets)
        if: steps.mode.outputs.ethics_only == 'false'
        run: python scripts/snapshot_member_ai.py --budget 20

      - name: Commit generated data
        if: steps.mode.outputs.ethics_only == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No static data changes to commit."
            exit 0
          fi
          git commit -m "update generated static data"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt/3); rebasing on origin/$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME" || git rebase --abort || true
            sleep 3
          done
          echo "::error::Could not push generated data after 3 attempts"
          exit 1
