name: Generate Static Data

on:
  workflow_dispatch:
    inputs:
      max_members:
        description: "Maximum members to snapshot"
        required: false
        default: "250"
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      MAX_MEMBERS: ${{ github.event.inputs.max_members || '250' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate static JSON snapshots
        run: python scripts/generate_static_data.py --max-members "$MAX_MEMBERS"

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No static data changes to commit."
          else
            git commit -m "update generated static data"
            git push
          fi
